<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excluir Documento - Agents Ferramentas AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: rgba(30, 41, 59, 0.7);
            --color-rose: #f43f5e;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(244, 63, 94, 0.04) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(30, 41, 59, 0.05) 0%, transparent 40%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .delete-card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(244, 63, 94, 0.15);
            border-radius: 24px;
            padding: 2.5rem;
            width: 100%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .warning-icon {
            font-size: 3.5rem;
            color: var(--color-rose);
            margin-bottom: 1.5rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.75rem;
            font-weight: 800;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }

        p {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .client-info-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 2.5rem;
            text-align: left;
        }

        .info-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .info-value {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-top: 0.25rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .btn-delete {
            display: block;
            width: 100%;
            padding: 0.85rem;
            font-size: 1rem;
            font-weight: 700;
            color: #ffffff;
            background: linear-gradient(90deg, var(--color-rose), #e11d48);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(244, 63, 94, 0.25);
            transition: all 0.25s;
        }

        .btn-delete:hover {
            opacity: 0.95;
            box-shadow: 0 8px 20px rgba(244, 63, 94, 0.45);
        }

        .btn-cancel {
            display: block;
            text-align: center;
            width: 100%;
            margin-top: 1.25rem;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s;
        }

        .btn-cancel:hover {
            color: var(--text-primary);
        }
    </style>
</head>
<body>
    <div class="delete-card">
        <div class="warning-icon">⚠️</div>
        <h1>Excluir Documento?</h1>
        <p>Você está prestes a remover definitivamente este arquivo do servidor e da base de dados. Esta ação não poderá ser revertida.</p>

        <div class="client-info-box">
            <div class="info-label">Cliente associado</div>
            <div style="font-size: 1rem; font-weight: 600; color: var(--text-primary); margin-bottom: 0.75rem;">👤 {{ cliente.nome }}</div>
            
            <div class="info-label">Documento a ser excluído</div>
            <div class="info-value">📄 {{ documento.nome }}</div>
        </div>

        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn-delete">Excluir Documento</button>
            <a href="{% url 'user:clientes_detail' cliente.pk %}" class="btn-cancel">Cancelar e Voltar</a>
        </form>
    </div>
</body>
</html>
